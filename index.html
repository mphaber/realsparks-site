<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Sparks</title>
<meta name="description" content="Real Sparks makes small, calm games. More to come.">
<style>
  :root{
    --ink:#1D2733;
    --cream:#F4F1EA;
    --gold:#F5B324;
    --orange:#F49E16;
    --yellow:#F7CE2E;
    --accent:#E4572E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:48px 24px 32px;
  }
  .burst{width:120px;height:120px;margin-bottom:8px}
  h1{
    font-size:clamp(2.4rem,7vw,3.6rem);
    letter-spacing:.01em;
    margin:10px 0 6px;
    font-weight:800;
  }
  p.tagline{
    font-size:clamp(1.05rem,3.4vw,1.3rem);
    margin:0 0 30px;
    color:#43505f;
  }
  a.games-btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:1.1rem;
    padding:15px 34px;
    border-radius:999px;
    box-shadow:0 6px 18px rgba(228,87,46,.35);
  }
  a.games-btn:hover{background:#cf4a24}
  p.soon{
    margin:22px 0 0;
    font-size:.98rem;
    color:#6b7887;
  }
  footer{
    margin-top:56px;
    font-size:.85rem;
    color:#8a96a3;
    line-height:1.7;
  }
</style>
</head>
<body>
  <svg class="burst" viewBox="0 0 100 100" aria-hidden="true">
    <g transform="translate(50 50)">
      <g fill="#F5B324">
        <rect x="-30" y="-30" width="60" height="60" rx="4"/>
        <rect x="-30" y="-30" width="60" height="60" rx="4" transform="rotate(45)"/>
      </g>
      <g fill="#F49E16">
        <rect x="-19" y="-19" width="38" height="38" rx="3"/>
        <rect x="-19" y="-19" width="38" height="38" rx="3" transform="rotate(45)"/>
      </g>
      <circle r="10" fill="#F7CE2E"/>
    </g>
  </svg>
  <h1>Real Sparks</h1>
  <p class="tagline">Small, calm games. No timers, no energy meters, no noise.</p>
  <a class="games-btn" href="https://games.realsparks.net/">Play Real Sparks Games</a>
  <p class="soon">More to come.</p>
  <footer>
    Real Sparks<br>
    Created by Matthew Haber<br>
    © 2026 Real Sparks. All rights reserved.
  </footer>
</body>
</html>
